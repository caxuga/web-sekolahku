name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, 'chore/**', 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci
      RUN_PAYLOAD_MIGRATIONS: 'false'
      PAYLOAD_SECRET: ci-only-secret-value-with-more-than-thirty-two-characters
      STORAGE_DRIVER: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Payload types
        run: pnpm generate:types
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build
