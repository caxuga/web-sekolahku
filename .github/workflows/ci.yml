name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, 'chore/**', 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URI: mongodb://127.0.0.1:27017/ci
          PAYLOAD_SECRET: ci-only-secret-value-with-more-than-thirty-two-characters
          STORAGE_DRIVER: local
